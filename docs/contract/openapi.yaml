openapi: 3.0.3
info:
  title: API M3 - Conductores y Vehículos
  version: 1.0.0
  description: Contrato del módulo M3 - Conductores y Vehículos.
servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Conductores
  - name: Vehículos
  - name: Documentación
  - name: Habilitación
  - name: Disponibilidad
  - name: Solicitudes
  - name: Calificación
  - name: Externo (M6)
    description: Implementado por M6, solo consumido por M3

paths:
  /conductores:
    post:
      tags: [Conductores]
      summary: Crear conductor
      description: Queda con habilitación PENDIENTE, desconectado y no disponible.
      operationId: crearConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConductorCreate'
            example:
              dni: "30123456"
              nombre: Ana
              apellido: Gómez
              telefono: "+5491176543210"
              email: ana.gomez@example.com
      responses:
        '201':
          description: Conductor creado
          headers:
            Location:
              description: URL del conductor creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conductor'
              example:
                id: 1
                dni: "30123456"
                nombre: Ana
                apellido: Gómez
                telefono: "+5491176543210"
                email: ana.gomez@example.com
                documentos: []
                vehiculos: []
                habilitacion: PENDIENTE
                conectado: false
                disponible: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya existe un conductor con ese DNI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: DNI_DUPLICADO
                mensaje: Ya existe un conductor con ese DNI.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Conductores]
      summary: Listar conductores
      description: Filtros opcionales. Con latitud y longitud ordena por cercanía y excluye ubicaciones vencidas.
      operationId: listarConductores
      parameters:
        - name: latitud
          in: query
          description: Requiere longitud
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitud
          in: query
          description: Requiere latitud
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: disponible
          in: query
          schema:
            type: boolean
        - name: habilitado
          in: query
          description: true solo con habilitación APROBADA
          schema:
            type: boolean
        - name: tipo_vehiculo
          in: query
          schema:
            $ref: '#/components/schemas/TipoVehiculo'
        - name: tipo_servicio
          in: query
          schema:
            $ref: '#/components/schemas/TipoServicio'
      responses:
        '200':
          description: Lista de conductores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConductorConUbicacion'
              example:
                - id: 1
                  dni: "30123456"
                  nombre: Ana
                  apellido: Gómez
                  telefono: "+5491176543210"
                  email: ana.gomez@example.com
                  documentos: []
                  vehiculos: []
                  habilitacion: APROBADA
                  conectado: true
                  disponible: true
                  latitud: -27.4511
                  longitud: -58.9867
                  fecha_act_ubic: "2026-10-22T10:15:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Conductores]
      summary: Obtener conductor
      operationId: obtenerConductor
      responses:
        '200':
          description: Conductor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConductorConUbicacion'
              example:
                id: 1
                dni: "30123456"
                nombre: Ana
                apellido: Gómez
                telefono: "+5491176543210"
                email: ana.gomez@example.com
                documentos: []
                vehiculos: []
                habilitacion: APROBADA
                conectado: true
                disponible: true
                latitud: -27.4511
                longitud: -58.9867
                fecha_act_ubic: "2026-10-22T10:15:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/habilitacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Habilitación]
      summary: Consultar habilitación del conductor
      operationId: obtenerHabilitacionConductor
      responses:
        '200':
          description: Estado e historial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacionResumen'
              example:
                id_conductor: 1
                estado: APROBADA
                historial:
                  - estado: PENDIENTE
                    motivo: Alta del conductor
                    id_operador: null
                    fecha: "2026-10-22T10:00:00Z"
                  - estado: APROBADA
                    motivo: Licencia vigente y documentación completa
                    id_operador: 7
                    fecha: "2026-10-22T12:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Habilitación]
      summary: Aprobar, observar, suspender o rechazar conductor
      description: Solo operadores autorizados. Registra un evento con motivo, operador y fecha.
      operationId: accionHabilitacionConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabilitacionAccionRequest'
            example:
              accion: APROBAR
              motivo: Licencia vigente y documentación completa
      responses:
        '200':
          description: Acción aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacionEventos'
              example:
                id_conductor: 1
                estado: APROBADA
                eventos:
                  - id: 1
                    accion: ALTA
                    estado_anterior: null
                    estado_nuevo: PENDIENTE
                    motivo: Alta del conductor
                    id_operador: null
                    fecha: "2026-10-22T10:00:00Z"
                  - id: 2
                    accion: APROBAR
                    estado_anterior: PENDIENTE
                    estado_nuevo: APROBADA
                    motivo: Licencia vigente y documentación completa
                    id_operador: 7
                    fecha: "2026-10-22T12:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: El conductor no tiene una licencia vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: LICENCIA_VIGENTE_REQUERIDA
                mensaje: El conductor no tiene una licencia vigente cargada.
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/documentacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    post:
      tags: [Documentación]
      summary: Registrar documentación del conductor
      operationId: crearDocumentacionConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentoConductorCreate'
            example:
              tipo: LICENCIA
              numero: LIC-12345678
              categoria: B1
              fecha_emision: "2024-05-10"
              fecha_vencimiento: "2028-05-10"
              url_archivo: https://storage.example.com/licencias/1.pdf
      responses:
        '201':
          description: Documento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoConductor'
              example:
                tipo: LICENCIA
                numero: LIC-12345678
                categoria: B1
                fecha_emision: "2024-05-10"
                fecha_vencimiento: "2028-05-10"
                url_archivo: https://storage.example.com/licencias/1.pdf
                id_conductor: 1
                estado: VIGENTE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    post:
      tags: [Vehículos]
      summary: Registrar vehículo
      description: Los tipos de servicio quedan sin habilitar hasta su aprobación.
      operationId: crearVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiculoCreate'
            example:
              tipo: AUTO
              patente: AB123CD
              marca: Toyota
              modelo: Corolla
              anio: 2022
              tipos_serv: [PASAJEROS]
      responses:
        '201':
          description: Vehículo registrado
          headers:
            Location:
              description: URL del vehículo creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehiculo'
              example:
                id: 1
                id_conductor: 1
                tipo: AUTO
                patente: AB123CD
                marca: Toyota
                modelo: Corolla
                anio: 2022
                tipos_serv:
                  - tipo: PASAJEROS
                    habilitado: false
                documentos: []
                habilitacion: PENDIENTE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya existe un vehículo con esa patente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: PATENTE_DUPLICADA
                mensaje: Ya existe un vehículo con esa patente.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Vehículos]
      summary: Listar vehículos del conductor
      operationId: listarVehiculos
      parameters:
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoVehiculo'
        - name: habilitacion
          in: query
          schema:
            $ref: '#/components/schemas/EstadoHabilitacion'
      responses:
        '200':
          description: Lista de vehículos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehiculoResumen'
              example:
                - id: 1
                  tipo: AUTO
                  patente: AB123CD
                  marca: Toyota
                  modelo: Corolla
                  anio: 2022
                  habilitacion: PENDIENTE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    get:
      tags: [Vehículos]
      summary: Obtener vehículo
      operationId: obtenerVehiculo
      responses:
        '200':
          description: Vehículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehiculo'
              example:
                id: 1
                id_conductor: 1
                tipo: AUTO
                patente: AB123CD
                marca: Toyota
                modelo: Corolla
                anio: 2022
                tipos_serv:
                  - tipo: PASAJEROS
                    habilitado: false
                documentos: []
                habilitacion: PENDIENTE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}/tipos-servicio:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    get:
      tags: [Vehículos]
      summary: Tipos de servicio del vehículo
      operationId: listarTiposServicioVehiculo
      responses:
        '200':
          description: Tipos de servicio y su habilitación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoServicioHabilitado'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}/documentacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    post:
      tags: [Documentación]
      summary: Registrar documentación del vehículo
      operationId: crearDocumentacionVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentoVehiculoCreate'
      responses:
        '201':
          description: Documento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoVehiculo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}/habilitacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    post:
      tags: [Habilitación]
      summary: Aprobar, observar, suspender o rechazar vehículo
      description: Solo operadores autorizados.
      operationId: accionHabilitacionVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabilitacionAccionRequest'
            example:
              accion: APROBAR
              motivo: Documentación del vehículo validada
      responses:
        '200':
          description: Acción aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacionVehiculoEventos'
              example:
                id_vehiculo: 1
                estado: APROBADA
                eventos:
                  - id: 1
                    accion: ALTA
                    estado_anterior: null
                    estado_nuevo: PENDIENTE
                    motivo: Alta del vehículo
                    id_operador: null
                    fecha: "2026-10-22T10:05:00Z"
                  - id: 2
                    accion: APROBAR
                    estado_anterior: PENDIENTE
                    estado_nuevo: APROBADA
                    motivo: Documentación del vehículo validada
                    id_operador: 7
                    fecha: "2026-10-22T13:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/estado:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    patch:
      tags: [Disponibilidad]
      summary: Actualizar conexión y disponibilidad
      description: Requiere conductor y vehículo activo habilitados. Opcionalmente actualiza la ubicación.
      operationId: actualizarEstadoConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoConductorRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoConductor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/solicitudes:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Solicitudes]
      summary: Listar solicitudes del conductor
      operationId: listarSolicitudesConductor
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoSolicitud'
      responses:
        '200':
          description: Lista de solicitudes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Solicitud'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /solicitudes/{id_solicitud}:
    parameters:
      - name: id_solicitud
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Solicitudes]
      summary: Aceptar o rechazar una solicitud
      description: Solo mientras la oferta esté vigente; vencida devuelve 410.
      operationId: responderSolicitud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaSolicitudRequest'
      responses:
        '200':
          description: Respuesta registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitud'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /viajes/{id_viaje}/calificacion-cliente:
    parameters:
      - $ref: '#/components/parameters/IdViaje'
    post:
      tags: [Calificación]
      summary: Calificar al cliente
      description: Solo viajes completados, una calificación por viaje.
      operationId: calificarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalificacionClienteRequest'
      responses:
        '201':
          description: Calificación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalificacionCliente'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /viajes/{id_viaje}:
    parameters:
      - $ref: '#/components/parameters/IdViaje'
    get:
      tags: [Externo (M6)]
      summary: Consultar estado y resumen del viaje
      operationId: obtenerViaje
      responses:
        '200':
          description: Viaje encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /viajes/{id_viaje}/finalizar:
    parameters:
      - $ref: '#/components/parameters/IdViaje'
    post:
      tags: [Externo (M6)]
      summary: Finalizar un viaje en curso
      description: Permite al conductor finalizar el viaje registrando los datos necesarios de tiempo, distancia.
      operationId: finalizarViaje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizarViajeRequest'
      responses:
        '200':
          description: Viaje finalizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /viajes/{id_viaje}/cancelar:
    parameters:
      - $ref: '#/components/parameters/IdViaje'
    post:
      tags: [Externo (M6)]
      summary: cancela un viaje por iniciarce
      description: Permite al conductor cancelar el viaje registrando motivo.
      operationId: cancelarViaje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarViajeRequest'
      responses:
        '200':
          description: Viaje cancelado 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdConductor:
      name: id_conductor
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdVehiculo:
      name: id_vehiculo
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdViaje:
      name: id_viaje
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Solicitud mal formada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOLICITUD_INVALIDA
            mensaje: El cuerpo de la solicitud no es válido.
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_AUTENTICADO
            mensaje: Token ausente o inválido.
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SIN_PERMISOS
            mensaje: Se requiere el rol operador.
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_ENCONTRADO
            mensaje: El recurso indicado no existe.
    Conflict:
      description: Duplicado o transición inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: TRANSICION_INVALIDA
            mensaje: La transición solicitada no está permitida.
    Gone:
      description: Oferta vencida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Incumple una regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DATOS_INVALIDOS
            mensaje: Los datos enviados no son válidos.
    InternalError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: ERROR_INTERNO
            mensaje: Ocurrió un error interno.

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
        mensaje:
          type: string

    EstadoHabilitacion:
      type: string
      enum: [PENDIENTE, OBSERVADA, APROBADA, SUSPENDIDA, RECHAZADA]
    AccionHabilitacion:
      type: string
      description: ALTA la genera el sistema.
      enum: [ALTA, APROBAR, OBSERVAR, SUSPENDER, RECHAZAR]
    TipoVehiculo:
      type: string
      enum: [AUTO, MOTO]
    TipoServicio:
      type: string
      enum: [PASAJEROS, ENVIOS]
    EstadoDocumento:
      type: string
      description: Según fecha_vencimiento.
      enum: [VIGENTE, VENCIDO]
    # TODO confirmar estados con M5
    EstadoSolicitud:
      type: string
      enum: [PENDIENTE, ACEPTADO, RECHAZADO, VENCIDA]
    # TODO confirmar estados con M6
    EstadoViaje:
      type: string
      enum: [SOLICITADO, ASIGNADO, EN_CURSO, FINALIZADO, CANCELADO]

    Ubicacion:
      type: object
      required: [latitud, longitud]
      properties:
        latitud:
          type: number
          format: double
        longitud:
          type: number
          format: double

    ConductorCreate:
      type: object
      required: [dni, nombre, apellido, telefono, email]
      properties:
        dni:
          type: string
          pattern: '^[0-9]{7,8}$'
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
        email:
          type: string
          format: email

    Conductor:
      allOf:
        - $ref: '#/components/schemas/ConductorCreate'
        - type: object
          required: [id, documentos, vehiculos, habilitacion, conectado, disponible]
          properties:
            id:
              type: integer
              format: int64
            documentos:
              type: array
              items:
                $ref: '#/components/schemas/DocumentoConductor'
            vehiculos:
              type: array
              items:
                $ref: '#/components/schemas/VehiculoResumen'
            habilitacion:
              $ref: '#/components/schemas/EstadoHabilitacion'
            conectado:
              type: boolean
            disponible:
              type: boolean

    ConductorConUbicacion:
      allOf:
        - $ref: '#/components/schemas/Conductor'
        - type: object
          properties:
            latitud:
              type: number
              format: double
              nullable: true
            longitud:
              type: number
              format: double
              nullable: true
            fecha_act_ubic:
              type: string
              format: date-time
              nullable: true

    EstadoConductorRequest:
      type: object
      description: Al menos un campo.
      minProperties: 1
      properties:
        conectado:
          type: boolean
        disponible:
          type: boolean
        id_vehiculo_activo:
          type: integer
          format: int64
          nullable: true
        # TODO confirmar con M4 cómo se reporta la ubicación
        latitud:
          type: number
          format: double
          description: Requiere longitud
        longitud:
          type: number
          format: double
          description: Requiere latitud

    EstadoConductor:
      type: object
      required: [id_conductor, conectado, disponible, actualizado]
      properties:
        id_conductor:
          type: integer
          format: int64
        conectado:
          type: boolean
        disponible:
          type: boolean
        id_vehiculo_activo:
          type: integer
          format: int64
          nullable: true
        actualizado:
          type: string
          format: date-time

    VehiculoCreate:
      type: object
      required: [tipo, patente, marca, modelo, anio, tipos_serv]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoVehiculo'
        patente:
          type: string
        marca:
          type: string
        modelo:
          type: string
        anio:
          type: integer
        tipos_serv:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TipoServicio'

    TipoServicioHabilitado:
      type: object
      required: [tipo, habilitado]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoServicio'
        habilitado:
          type: boolean

    Vehiculo:
      type: object
      required: [id, id_conductor, tipo, patente, marca, modelo, anio, tipos_serv, documentos, habilitacion]
      properties:
        id:
          type: integer
          format: int64
        id_conductor:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoVehiculo'
        patente:
          type: string
        marca:
          type: string
        modelo:
          type: string
        anio:
          type: integer
        tipos_serv:
          type: array
          items:
            $ref: '#/components/schemas/TipoServicioHabilitado'
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoVehiculo'
        habilitacion:
          $ref: '#/components/schemas/EstadoHabilitacion'

    VehiculoResumen:
      type: object
      required: [id, tipo, patente, marca, modelo, anio, habilitacion]
      properties:
        id:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoVehiculo'
        patente:
          type: string
        marca:
          type: string
        modelo:
          type: string
        anio:
          type: integer
        habilitacion:
          $ref: '#/components/schemas/EstadoHabilitacion'

    DocumentoConductorCreate:
      type: object
      required: [tipo, numero, fecha_emision, fecha_vencimiento, url_archivo]
      properties:
        tipo:
          type: string
          enum: [LICENCIA]
        numero:
          type: string
        categoria:
          type: string
        fecha_emision:
          type: string
          format: date
        fecha_vencimiento:
          type: string
          format: date
        url_archivo:
          type: string
          format: uri

    DocumentoConductor:
      allOf:
        - $ref: '#/components/schemas/DocumentoConductorCreate'
        - type: object
          required: [id_conductor, estado]
          properties:
            id_conductor:
              type: integer
              format: int64
            estado:
              $ref: '#/components/schemas/EstadoDocumento'

    DocumentoVehiculoCreate:
      type: object
      required: [tipo, numero, fecha_emision, fecha_vencimiento, url_archivo]
      properties:
        tipo:
          type: string
          enum: [SEGURO, CEDULA_VERDE, VTV]
        numero:
          type: string
        entidad_emisora:
          type: string
        fecha_emision:
          type: string
          format: date
        fecha_vencimiento:
          type: string
          format: date
        url_archivo:
          type: string
          format: uri

    DocumentoVehiculo:
      allOf:
        - $ref: '#/components/schemas/DocumentoVehiculoCreate'
        - type: object
          required: [id_vehiculo, estado]
          properties:
            id_vehiculo:
              type: integer
              format: int64
            estado:
              $ref: '#/components/schemas/EstadoDocumento'

    HabilitacionAccionRequest:
      type: object
      required: [accion, motivo]
      properties:
        accion:
          type: string
          enum: [APROBAR, OBSERVAR, SUSPENDER, RECHAZAR]
        motivo:
          type: string
          minLength: 1

    HabilitacionHistorialItem:
      type: object
      required: [estado, motivo, fecha]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        motivo:
          type: string
        id_operador:
          type: integer
          format: int64
          nullable: true
        fecha:
          type: string
          format: date-time

    HabilitacionResumen:
      type: object
      required: [id_conductor, estado, historial]
      properties:
        id_conductor:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        historial:
          type: array
          items:
            $ref: '#/components/schemas/HabilitacionHistorialItem'

    HabilitacionEvento:
      type: object
      required: [id, accion, estado_nuevo, motivo, fecha]
      properties:
        id:
          type: integer
          format: int64
        accion:
          $ref: '#/components/schemas/AccionHabilitacion'
        estado_anterior:
          type: string
          enum: [PENDIENTE, OBSERVADA, APROBADA, SUSPENDIDA, RECHAZADA]
          nullable: true
          description: null en el evento ALTA
        estado_nuevo:
          $ref: '#/components/schemas/EstadoHabilitacion'
        motivo:
          type: string
        id_operador:
          type: integer
          format: int64
          nullable: true
          description: null si lo genera el sistema
        fecha:
          type: string
          format: date-time

    HabilitacionEventos:
      type: object
      required: [id_conductor, estado, eventos]
      properties:
        id_conductor:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/HabilitacionEvento'

    HabilitacionVehiculoEventos:
      type: object
      required: [id_vehiculo, estado, eventos]
      properties:
        id_vehiculo:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/HabilitacionEvento'

    # TODO confirmar campos con M5
    Solicitud:
      type: object
      required: [id, id_conductor, estado, vence_en]
      example:
        id: 340
        id_conductor: 15
        id_viaje: 5521
        estado: ACEPTADO
        vence_en: '2026-10-03T18:45:30Z'
        respuesta: ACEPTADO
        hora_rta: '2026-10-03T18:44:10Z'
      properties:
        id:
          type: integer
          format: int64
        id_conductor:
          type: integer
          format: int64
        id_viaje:
          type: integer
          format: int64
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        vence_en:
          type: string
          format: date-time
          description: Límite para responder
        respuesta:
          type: string
          enum: [ACEPTADO, RECHAZADO]
          nullable: true
        hora_rta:
          type: string
          format: date-time
          nullable: true

    RespuestaSolicitudRequest:
      type: object
      required: [respuesta, hora_rta]
      properties:
        respuesta:
          type: string
          enum: [ACEPTADO, RECHAZADO]
        hora_rta:
          type: string
          format: date-time

    CalificacionClienteRequest:
      type: object
      required: [puntaje]
      properties:
        puntaje:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
          maxLength: 500

    CalificacionCliente:
      type: object
      required: [id, id_viaje, id_conductor, id_cliente, puntaje, fecha]
      properties:
        id:
          type: integer
          format: int64
        id_viaje:
          type: integer
          format: int64
        id_conductor:
          type: integer
          format: int64
        id_cliente:
          type: integer
          format: int64
        puntaje:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
          nullable: true
        fecha:
          type: string
          format: date-time
    
    FinalizarViajeRequest:
      type: object
      required: [tiempo, distancia,cierre]
      properties:
        tiempo:
          type: integer
          description: tiempo total en minutos
          minimum: 0
        distancia:
          type: number
          format: double
          description: distancia total recorrida en kilometros
          minimum: 0
        cierre:
          type: boolean
    
    CancelarViajeRequest:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          enum: [ OTRO , DEFECTO MECANICO , PASAJERO NO VINO]
        
    # TODO confirmar campos con M6
    Viaje:
      type: object
      required: [id, estado, retiro, destino, inicio, id_conductor, id_vehiculo, id_cliente]
      example:
        id: 5521
        estado: FINALIZADO
        retiro:
          latitud: -27.4511
          longitud: -58.9867
        destino:
          latitud: -27.4698
          longitud: -58.8306
        tiempo_estimado: 18
        inicio: '2026-10-03T18:50:00Z'
        fin: '2026-10-03T19:08:00Z'
        id_conductor: 15
        id_vehiculo: 7
        id_cliente: 88
      properties:
        id:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoViaje'
        retiro:
          $ref: '#/components/schemas/Ubicacion'
        destino:
          $ref: '#/components/schemas/Ubicacion'
        tiempo_estimado:
          type: integer
          nullable: true
          description: Minutos
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
          nullable: true
        id_conductor:
          type: integer
          format: int64
        id_vehiculo:
          type: integer
          format: int64
        id_cliente:
          type: integer
          format: int64
        distancia:
          type: number
          format: double
          nullable: true
