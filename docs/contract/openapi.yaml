openapi: 3.0.3
info:
  title: API M3 - Conductores y Vehículos
  version: 1.2.0
  description: |
    Contrato del módulo M3 - Conductores y Vehículos.

    Describe solo lo que M3 expone.

    | Módulo | Sentido | Operación |
    |---|---|---|
    | M4 | M4 → M3 | `GET /conductores`, `GET /conductores/{id_conductor}`, `GET /conductores/{id_conductor}/estado` y `GET /conductores/{id_conductor}/ubicacion`: lectura de estado y ubicación |
    | M5 | M5 → M3 | `POST /conductores/{id_conductor}/solicitudes`: M5 envía un viaje, M3 lo guarda como `PENDIENTE` y lo expone en `GET /conductores/{id_conductor}/solicitudes`. Al aceptar, M3 lo confirma con M5 de forma síncrona y solo con el OK pasa el conductor a `OCUPADO`. |
    | M6 | M6 → M3 | `POST /conductores/{id_conductor}/calificaciones`: M6 registra la valoración del conductor al finalizar un viaje. |

    El estado y la ubicación del conductor los informa el propio conductor con `PATCH /conductores/{id_conductor}/estado`. `OCUPADO` lo asigna M3 únicamente después de que M5 confirme la aceptación de una solicitud.

    Todas las fechas y horas están en UTC (ISO 8601 con `Z`).
servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Conductores
  - name: Vehículos
  - name: Documentación
  - name: Habilitación
  - name: Disponibilidad
  - name: Solicitudes
  - name: Calificación

paths:
  /conductores:
    post:
      tags: [Conductores]
      summary: Crear conductor
      description: Queda con habilitación PENDIENTE y en estado DESCONECTADO.
      operationId: crearConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConductorCreate'
            example:
              dni: "30123456"
              nombre: Ana
              apellido: Gómez
              telefono: "+5491176543210"
              email: ana.gomez@example.com
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '201':
          description: Conductor creado
          headers:
            Location:
              description: URL del conductor creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conductor'
              example:
                id: '98ced537-b1b8-567d-8bc9-25984e296b7b'
                dni: "30123456"
                nombre: Ana
                apellido: Gómez
                telefono: "+5491176543210"
                email: ana.gomez@example.com
                documentos: []
                vehiculos: []
                habilitacion: PENDIENTE
                estado: DESCONECTADO
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya existe un conductor con ese DNI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: DNI_DUPLICADO
                mensaje: Ya existe un conductor con ese DNI.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Conductores]
      summary: Listar conductores
      description: Solo para los roles operador y servicio. Filtros opcionales de estado, habilitación, tipo de vehículo y tipo de servicio (al menos un vehículo con ese tipo de servicio habilitado), combinados en conjunción. Devuelve la ubicación persistida y su fecha, o null si no existe. latitud y longitud se aceptan (juntas y en rango) pero no filtran ni ordenan; no se aplica vencimiento de ubicación. El parámetro disponible de la versión 1.0.0 ya no existe y responde 400.
      operationId: listarConductores
      parameters:
        - name: latitud
          in: query
          description: Requiere longitud
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitud
          in: query
          description: Requiere latitud
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoOperativo'
        - name: habilitado
          in: query
          description: true solo con habilitación APROBADA
          schema:
            type: boolean
        - name: tipo_vehiculo
          in: query
          schema:
            $ref: '#/components/schemas/TipoVehiculo'
        - name: tipo_servicio
          in: query
          schema:
            $ref: '#/components/schemas/TipoServicio'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Lista de conductores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConductorConUbicacion'
              example:
                - id: '98ced537-b1b8-567d-8bc9-25984e296b7b'
                  dni: "30123456"
                  nombre: Ana
                  apellido: Gómez
                  telefono: "+5491176543210"
                  email: ana.gomez@example.com
                  documentos: []
                  vehiculos: []
                  habilitacion: APROBADA
                  estado: DISPONIBLE
                  latitud: -27.4511
                  longitud: -58.9867
                  fecha_act_ubic: "2026-10-22T10:15:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Conductores]
      summary: Obtener conductor
      operationId: obtenerConductor
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Conductor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConductorConUbicacion'
              example:
                id: '98ced537-b1b8-567d-8bc9-25984e296b7b'
                dni: "30123456"
                nombre: Ana
                apellido: Gómez
                telefono: "+5491176543210"
                email: ana.gomez@example.com
                documentos: []
                vehiculos: []
                habilitacion: APROBADA
                estado: DISPONIBLE
                latitud: -27.4511
                longitud: -58.9867
                fecha_act_ubic: "2026-10-22T10:15:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/habilitacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Habilitación]
      summary: Consultar habilitación del conductor
      operationId: obtenerHabilitacionConductor
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Estado e historial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacionResumen'
              example:
                id_conductor: 'caa3df2f-5a09-52ce-b724-3adee32a8614'
                estado: APROBADA
                historial:
                  - estado: PENDIENTE
                    motivo: Alta del conductor
                    id_operador: null
                    fecha: "2026-10-22T10:00:00Z"
                  - estado: APROBADA
                    motivo: Licencia vigente y documentación completa
                    id_operador: 'd5a0cae9-26da-5de5-940c-71e16bb97091'
                    fecha: "2026-10-22T12:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Habilitación]
      summary: Aprobar, observar, suspender o rechazar conductor
      description: Solo operadores autorizados. Registra un evento con motivo, operador y fecha.
      operationId: accionHabilitacionConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabilitacionAccionRequest'
            example:
              accion: APROBAR
              motivo: Licencia vigente y documentación completa
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Acción aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacionEventos'
              example:
                id_conductor: 'caa3df2f-5a09-52ce-b724-3adee32a8614'
                estado: APROBADA
                eventos:
                  - id: '98ced537-b1b8-567d-8bc9-25984e296b7b'
                    accion: ALTA
                    estado_anterior: null
                    estado_nuevo: PENDIENTE
                    motivo: Alta del conductor
                    id_operador: null
                    fecha: "2026-10-22T10:00:00Z"
                  - id: 'b8ec14f1-50f3-5a40-b9c2-07ce5b8cde79'
                    accion: APROBAR
                    estado_anterior: PENDIENTE
                    estado_nuevo: APROBADA
                    motivo: Licencia vigente y documentación completa
                    id_operador: 'd5a0cae9-26da-5de5-940c-71e16bb97091'
                    fecha: "2026-10-22T12:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: El conductor no tiene una licencia vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: LICENCIA_VIGENTE_REQUERIDA
                mensaje: El conductor no tiene una licencia vigente cargada.
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/documentacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    post:
      tags: [Documentación]
      summary: Registrar documentación del conductor
      operationId: crearDocumentacionConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentoConductorCreate'
            example:
              tipo: LICENCIA
              numero: LIC-12345678
              categoria: B1
              fecha_emision: "2024-05-10"
              fecha_vencimiento: "2028-05-10"
              url_archivo: https://storage.example.com/licencias/1.pdf
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '201':
          description: Documento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoConductor'
              example:
                tipo: LICENCIA
                numero: LIC-12345678
                categoria: B1
                fecha_emision: "2024-05-10"
                fecha_vencimiento: "2028-05-10"
                url_archivo: https://storage.example.com/licencias/1.pdf
                id_conductor: 'caa3df2f-5a09-52ce-b724-3adee32a8614'
                estado: VIGENTE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    post:
      tags: [Vehículos]
      summary: Registrar vehículo
      description: Los tipos de servicio quedan sin habilitar hasta su aprobación.
      operationId: crearVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiculoCreate'
            example:
              tipo: AUTO
              patente: AB123CD
              marca: Toyota
              modelo: Corolla
              anio: 2022
              tipos_serv: [PASAJEROS]
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '201':
          description: Vehículo registrado
          headers:
            Location:
              description: URL del vehículo creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehiculo'
              example:
                id: '98ced537-b1b8-567d-8bc9-25984e296b7b'
                id_conductor: 'caa3df2f-5a09-52ce-b724-3adee32a8614'
                tipo: AUTO
                patente: AB123CD
                marca: Toyota
                modelo: Corolla
                anio: 2022
                tipos_serv:
                  - tipo: PASAJEROS
                    habilitado: false
                documentos: []
                habilitacion: PENDIENTE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya existe un vehículo con esa patente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: PATENTE_DUPLICADA
                mensaje: Ya existe un vehículo con esa patente.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Vehículos]
      summary: Listar vehículos del conductor
      operationId: listarVehiculos
      parameters:
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoVehiculo'
        - name: habilitacion
          in: query
          schema:
            $ref: '#/components/schemas/EstadoHabilitacion'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Lista de vehículos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehiculoResumen'
              example:
                - id: '98ced537-b1b8-567d-8bc9-25984e296b7b'
                  tipo: AUTO
                  patente: AB123CD
                  marca: Toyota
                  modelo: Corolla
                  anio: 2022
                  habilitacion: PENDIENTE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    get:
      tags: [Vehículos]
      summary: Obtener vehículo
      operationId: obtenerVehiculo
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Vehículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehiculo'
              example:
                id: '98ced537-b1b8-567d-8bc9-25984e296b7b'
                id_conductor: 'caa3df2f-5a09-52ce-b724-3adee32a8614'
                tipo: AUTO
                patente: AB123CD
                marca: Toyota
                modelo: Corolla
                anio: 2022
                tipos_serv:
                  - tipo: PASAJEROS
                    habilitado: false
                documentos: []
                habilitacion: PENDIENTE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}/tipos-servicio:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    get:
      tags: [Vehículos]
      summary: Tipos de servicio del vehículo
      operationId: listarTiposServicioVehiculo
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Tipos de servicio y su habilitación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoServicioHabilitado'
              example:
                - tipo: PASAJEROS
                  habilitado: true
                - tipo: ENVIOS
                  habilitado: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}/documentacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    post:
      tags: [Documentación]
      summary: Registrar documentación del vehículo
      operationId: crearDocumentacionVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentoVehiculoCreate'
            example:
              tipo: SEGURO
              numero: POL-123456
              entidad_emisora: Aseguradora de prueba
              fecha_emision: '2026-01-01'
              fecha_vencimiento: '2027-01-01'
              url_archivo: https://storage.example.com/seguro.pdf
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '201':
          description: Documento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoVehiculo'
              example:
                id_vehiculo: '4697c312-9dc5-57e2-820f-ef7f84215e81'
                tipo: SEGURO
                numero: POL-123456
                entidad_emisora: Aseguradora de prueba
                fecha_emision: '2026-01-01'
                fecha_vencimiento: '2027-01-01'
                url_archivo: https://storage.example.com/seguro.pdf
                estado: VIGENTE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}/habilitacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    post:
      tags: [Habilitación]
      summary: Aprobar, observar, suspender o rechazar vehículo
      description: Solo operadores autorizados.
      operationId: accionHabilitacionVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabilitacionAccionRequest'
            example:
              accion: APROBAR
              motivo: Documentación del vehículo validada
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Acción aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacionVehiculoEventos'
              example:
                id_vehiculo: '5a562551-1799-59df-aaea-f78ce401fbae'
                estado: APROBADA
                eventos:
                  - id: '98ced537-b1b8-567d-8bc9-25984e296b7b'
                    accion: ALTA
                    estado_anterior: null
                    estado_nuevo: PENDIENTE
                    motivo: Alta del vehículo
                    id_operador: null
                    fecha: "2026-10-22T10:05:00Z"
                  - id: 'b8ec14f1-50f3-5a40-b9c2-07ce5b8cde79'
                    accion: APROBAR
                    estado_anterior: PENDIENTE
                    estado_nuevo: APROBADA
                    motivo: Documentación del vehículo validada
                    id_operador: 'd5a0cae9-26da-5de5-940c-71e16bb97091'
                    fecha: "2026-10-22T13:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/estado:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Disponibilidad]
      summary: Consultar el estado del conductor
      description: Devuelve el estado del conductor (DESCONECTADO, CONECTADO, DISPONIBLE u OCUPADO) y el vehículo activo. La ubicación se consulta aparte en `GET /conductores/{id_conductor}/ubicacion`. Lo consulta M4. Roles `conductor`, `operador` y `servicio`.
      operationId: obtenerEstadoConductor
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Estado vigente del conductor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoConductor'
              example:
                id_conductor: 'ab3ee30c-086d-5902-a647-ce922f90172e'
                estado: DISPONIBLE
                id_vehiculo_activo: '4697c312-9dc5-57e2-820f-ef7f84215e81'
                actualizado: '2026-11-02T01:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Disponibilidad]
      summary: Actualizar el estado del conductor
      description: |
        Lo usa el conductor (o un operador) para informar su estado, el vehículo activo y la ubicación.

        - `estado` puede pedirse como `DESCONECTADO`, `CONECTADO` o `DISPONIBLE`. `OCUPADO` no se puede pedir: lo asigna M3 (ver abajo).
        - `DESCONECTADO` y `CONECTADO` se aceptan siempre, también desde `OCUPADO`.
        - Para quedar `DISPONIBLE`, el conductor debe tener habilitación APROBADA y un vehículo activo también APROBADA. Si no, responde `422` con `CONDUCTOR_NO_HABILITADO` y no cambia nada. Pedir `DISPONIBLE` estando `DESCONECTADO` también lo conecta, y estando `OCUPADO` lo libera.
        - Si se quita el vehículo activo, o se cambia a uno que no está APROBADA, un conductor `DISPONIBLE` pasa a `CONECTADO`.
        - Si se informan `latitud` y `longitud` (siempre juntas), M3 las guarda y fija `fecha_act_ubic` con la hora del servidor. Si no se informan, M3 puede simular la ubicación porque el TPI no tiene una app móvil que reporte GPS.
        - Al aceptar una solicitud con `POST /solicitudes/{id_solicitud}`, M3 pasa al conductor a `OCUPADO`. Vuelve a `DISPONIBLE` cuando el conductor lo pide con esta operación.
      operationId: actualizarEstadoConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoConductorRequest'
            example:
              estado: CONECTADO
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoConductor'
              example:
                id_conductor: 'ab3ee30c-086d-5902-a647-ce922f90172e'
                estado: CONECTADO
                id_vehiculo_activo: '4697c312-9dc5-57e2-820f-ef7f84215e81'
                actualizado: '2026-11-02T01:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: El conductor no puede quedar DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: CONDUCTOR_NO_HABILITADO
                mensaje: El conductor debe estar habilitado y tener un vehículo activo habilitado.
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/ubicacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Disponibilidad]
      summary: Consultar la ubicación del conductor
      description: Devuelve la última ubicación registrada y su fecha. Si todavía no hay ninguna, responde 200 con los tres campos en null, que debe tratarse como ubicación desconocida y nunca como (0, 0). No aplica vencimiento de ubicación. Lo consulta M4. Roles `conductor`, `operador` y `servicio`.
      operationId: obtenerUbicacionConductor
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Última ubicación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UbicacionConductor'
              example:
                id_conductor: 'ab3ee30c-086d-5902-a647-ce922f90172e'
                latitud: -27.4511
                longitud: -58.9867
                fecha_act_ubic: '2026-11-02T01:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/calificaciones:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    post:
      tags: [Calificación]
      summary: Registrar calificación hacia el conductor
      description: |
        Registra el puntaje otorgado por un pasajero tras finalizar un viaje (RF-2.5).
        La invoca M6 con el rol `servicio`. M6 garantiza que el viaje está
        `COMPLETED`: M3 no puede verificarlo porque no consulta a M6.

        M3 valida solo lo que tiene:
        - Debe existir una oferta `ACEPTADO` de este conductor para ese `id_viaje`; si no, devuelve `404 NO_ENCONTRADO`.
        - El viaje no debe haber sido calificado antes; si ya lo fue con otro `puntaje`, devuelve `409 CALIFICACION_DUPLICADA`.
        - `puntaje` debe estar entre 1 y 5; si no, devuelve `422 DATOS_INVALIDOS`.

        Un reenvío idéntico (mismo `id_viaje` y mismo `puntaje`) devuelve `201` con la calificación existente.
        Roles permitidos: servicio (M6).
      operationId: calificarConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalificacionConductorRequest'
            example:
              id_viaje: '7b0e3a8e-4f7c-4d1a-9a52-1f0c2f9d6b11'
              puntaje: 5
      responses:
        '201':
          description: Calificación registrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalificacionConductor'
              example:
                id: 'b7f91658-e680-5b4b-88bc-0218000f7a75'
                id_viaje: '7b0e3a8e-4f7c-4d1a-9a52-1f0c2f9d6b11'
                id_conductor: 'ab3ee30c-086d-5902-a647-ce922f90172e'
                puntaje: 5
                fecha: '2026-11-20T22:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CalificacionDuplicada'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /conductores/{id_conductor}/solicitudes:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Solicitudes]
      summary: Listar solicitudes del conductor
      description: |
        Devuelve las ofertas que M5 envió y M3 guardó para el conductor. Permite filtrar
        por `estado` para elegir una oferta `PENDIENTE` y responderla con `POST /solicitudes/{id_solicitud}`.
      operationId: listarSolicitudesConductor
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoSolicitud'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Lista de solicitudes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Solicitud'
              example:
                - id: 'bfd4ec04-6172-5cc3-9ead-d634fcf06bb7'
                  id_conductor: 'ab3ee30c-086d-5902-a647-ce922f90172e'
                  id_viaje: '7b0e3a8e-4f7c-4d1a-9a52-1f0c2f9d6b11'
                  id_solicitud_m5: '0c6a4f0e-8f43-4d3b-a3b7-6a1f2c8e9d10'
                  tipo_servicio: PASAJEROS
                  origen:
                    latitud: -27.4511
                    longitud: -58.9867
                    direccion: 'Av. 9 de Julio 500'
                  destino:
                    latitud: -27.4698
                    longitud: -58.8306
                    direccion: 'Av. Sarmiento 1200'
                  estado: PENDIENTE
                  vence_en: '2026-11-21T23:59:00Z'
                  respuesta: null
                  hora_rta: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Solicitudes]
      summary: Recibir oferta de viaje desde M5
      description: |
        Lo invoca **M5** (rol `servicio`) para enviar una oferta de viaje a un conductor candidato.
        M3 la guarda como `PENDIENTE` y la expone en `GET /conductores/{id_conductor}/solicitudes`.
        El conductor debe estar habilitado (`APROBADA`) y `DISPONIBLE`; de lo contrario responde `422 CONDUCTOR_NO_HABILITADO`.

        No se permiten dos ofertas con el mismo `id_solicitud_m5`, ni dos ofertas con el mismo
        `id_viaje` para un mismo conductor: si llegan con datos distintos, devuelve `409 SOLICITUD_DUPLICADA`.
        Un reenvío idéntico devuelve `201` con la oferta existente, sin crear otra.
      operationId: crearSolicitudConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCreate'
            example:
              id_solicitud_m5: "0c6a4f0e-8f43-4d3b-a3b7-6a1f2c8e9d10"
              id_viaje: '7b0e3a8e-4f7c-4d1a-9a52-1f0c2f9d6b11'
              tipo_servicio: PASAJEROS
              origen:
                latitud: -27.4511
                longitud: -58.9867
                direccion: "Av. 9 de Julio 500"
              destino:
                latitud: -27.4698
                longitud: -58.8306
                direccion: "Av. Sarmiento 1200"
              vence_en: "2026-11-22T00:35:00Z"
      responses:
        '201':
          description: Oferta de solicitud registrada para el conductor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitud'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SolicitudDuplicada'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /solicitudes/{id_solicitud}:
    parameters:
      - name: id_solicitud
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Solicitudes]
      summary: Aceptar o rechazar una solicitud
      description: |
        El conductor acepta o rechaza una oferta `PENDIENTE` mientras esté vigente; vencida devuelve `410`.
        Si `respuesta` es `RECHAZADO`, M3 guarda el rechazo sin consultar a M5.
        Si es `ACEPTADO`, M3 lo confirma con M5 de forma síncrona.

        - Con el OK de M5: M3 guarda `ACEPTADO` y pasa al conductor a `OCUPADO`.
        - Si M5 no valida la aceptación: `409 TRANSICION_INVALIDA`.
        - Si M5 no responde en 2 segundos o devuelve un error: `502 M5_NO_DISPONIBLE`.

        No hay reintentos automáticos: ante cualquier falla la oferta sigue `PENDIENTE`,
        el conductor sigue `DISPONIBLE` y el cliente puede volver a intentar.
      operationId: responderSolicitud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaSolicitudRequest'
            example:
              respuesta: RECHAZADO
              hora_rta: '2026-10-03T18:44:10Z'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Respuesta registrada; si fue aceptada, M5 la validó y el conductor quedó OCUPADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitud'
              example:
                id: 'bfd4ec04-6172-5cc3-9ead-d634fcf06bb7'
                id_conductor: 'ab3ee30c-086d-5902-a647-ce922f90172e'
                id_viaje: '7b0e3a8e-4f7c-4d1a-9a52-1f0c2f9d6b11'
                id_solicitud_m5: '0c6a4f0e-8f43-4d3b-a3b7-6a1f2c8e9d10'
                tipo_servicio: PASAJEROS
                origen:
                  latitud: -27.4511
                  longitud: -58.9867
                  direccion: 'Av. 9 de Julio 500'
                destino:
                  latitud: -27.4698
                  longitud: -58.8306
                  direccion: 'Av. Sarmiento 1200'
                estado: ACEPTADO
                vence_en: '2026-11-21T23:59:00Z'
                respuesta: ACEPTADO
                hora_rta: '2026-11-21T18:44:10Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ServicioM5NoDisponible'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT emitido por Keycloak (realm `m3`). Roles:

        - `operador`: acciones de habilitación. El token trae el claim `id_operador` (UUID).
        - `conductor`: opera sobre sus propios datos. El token trae el claim `id_conductor` (UUID); si pide datos de otro conductor recibe `403 ACCESO_PROHIBIDO`. No puede listar conductores (`GET /conductores`).
        - `servicio`: cuenta técnica compartida por los otros módulos (M4, M5 y M6). Puede leer conductores, vehículos, estado y ubicación; M5 envía ofertas de viaje y M6 registra calificaciones.

  parameters:
    IdConductor:
      name: id_conductor
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdVehiculo:
      name: id_vehiculo
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Solicitud mal formada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOLICITUD_INVALIDA
            mensaje: El cuerpo de la solicitud no es válido.
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_AUTENTICADO
            mensaje: Token ausente o inválido.
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SIN_PERMISOS
            mensaje: Se requiere el rol operador.
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_ENCONTRADO
            mensaje: El recurso indicado no existe.
    Conflict:
      description: Duplicado o transición inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: TRANSICION_INVALIDA
            mensaje: La transición solicitada no está permitida.
    Gone:
      description: Oferta vencida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOLICITUD_VENCIDA
            mensaje: La solicitud ya venció.
    UnprocessableEntity:
      description: Incumple una regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DATOS_INVALIDOS
            mensaje: Los datos enviados no son válidos.
    TooManyRequests:
      description: Se alcanzó el límite de solicitudes; reintente más tarde.
      headers:
        Retry-After:
          description: Segundos enteros hasta la próxima solicitud permitida.
          schema:
            type: string
            pattern: '^[0-9]+$'
        Cache-Control:
          description: Evita almacenar en caché la respuesta de limitación.
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: LIMITE_DE_SOLICITUDES
            mensaje: Se alcanzó el límite de solicitudes; reintente más tarde.
    ServiceUnavailable:
      description: El servicio no está disponible temporalmente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SERVICIO_TEMPORALMENTE_NO_DISPONIBLE
            mensaje: El servicio no está disponible temporalmente.
    ServicioM5NoDisponible:
      description: M5 no respondió dentro del timeout o devolvió un error al confirmar la aceptación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: M5_NO_DISPONIBLE
            mensaje: No se pudo confirmar la aceptación con M5; la oferta sigue PENDIENTE.
    SolicitudDuplicada:
      description: Ya existe para ese conductor una oferta con el mismo `id_solicitud_m5` o `id_viaje` y datos distintos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOLICITUD_DUPLICADA
            mensaje: La oferta ya existe para ese conductor con otros datos.
    CalificacionDuplicada:
      description: El viaje ya fue calificado con un puntaje distinto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: CALIFICACION_DUPLICADA
            mensaje: El viaje ya fue calificado con otro puntaje.
    InternalError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: ERROR_INTERNO
            mensaje: Ocurrió un error interno.

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
        mensaje:
          type: string

    EstadoHabilitacion:
      type: string
      enum: [PENDIENTE, OBSERVADA, APROBADA, SUSPENDIDA, RECHAZADA]
    AccionHabilitacion:
      type: string
      description: ALTA la genera el sistema.
      enum: [ALTA, APROBAR, OBSERVAR, SUSPENDER, RECHAZAR]
    TipoVehiculo:
      type: string
      enum: [AUTO, MOTO]
    TipoServicio:
      type: string
      enum: [PASAJEROS, ENVIOS]
    EstadoDocumento:
      type: string
      description: Según fecha_vencimiento.
      enum: [VIGENTE, VENCIDO]

    EstadoOperativo:
      type: string
      description: |
        Qué está haciendo el conductor ahora.

        - `DESCONECTADO`: no tiene la app activa.
        - `CONECTADO`: está activo pero no recibe viajes (en pausa).
        - `DISPONIBLE`: puede recibir viajes. Exige habilitación APROBADA y un vehículo activo APROBADA.
        - `OCUPADO`: está en un viaje. Lo asigna M3 cuando M5 confirma la aceptación de una solicitud; no se puede pedir en `PATCH /conductores/{id_conductor}/estado`.
      enum: [DESCONECTADO, CONECTADO, DISPONIBLE, OCUPADO]

    EstadoSolicitud:
      type: string
      enum: [PENDIENTE, ACEPTADO, RECHAZADO, VENCIDA]
    ConductorCreate:
      type: object
      required: [dni, nombre, apellido, telefono, email]
      properties:
        dni:
          type: string
          maxLength: 8
          pattern: '^[0-9]{7,8}$'
        nombre:
          type: string
          maxLength: 100
        apellido:
          type: string
          maxLength: 100
        telefono:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 255
          format: email

    Conductor:
      allOf:
        - $ref: '#/components/schemas/ConductorCreate'
        - type: object
          required: [id, documentos, vehiculos, habilitacion, estado]
          properties:
            id:
              type: string
              format: uuid
            documentos:
              type: array
              items:
                $ref: '#/components/schemas/DocumentoConductor'
            vehiculos:
              type: array
              items:
                $ref: '#/components/schemas/VehiculoResumen'
            habilitacion:
              $ref: '#/components/schemas/EstadoHabilitacion'
            estado:
              $ref: '#/components/schemas/EstadoOperativo'
            puntaje_promedio:
              type: number
              format: double
              minimum: 1
              maximum: 5
              nullable: true
              description: Promedio de los puntajes recibidos. null si todavía no tiene.
            cantidad_calificaciones:
              type: integer
              minimum: 0
              default: 0

    ConductorConUbicacion:
      allOf:
        - $ref: '#/components/schemas/Conductor'
        - type: object
          properties:
            id_vehiculo_activo:
              type: string
              format: uuid
              nullable: true
              description: Vehículo con el que trabaja el conductor. null si no tiene uno activo.
            latitud:
              type: number
              format: double
              nullable: true
            longitud:
              type: number
              format: double
              nullable: true
            fecha_act_ubic:
              type: string
              format: date-time
              nullable: true

    EstadoConductorRequest:
      type: object
      description: Al menos un campo. La ubicación es opcional; si no se informa, M3 puede simularla.
      minProperties: 1
      properties:
        estado:
          type: string
          description: No admite OCUPADO, que lo asigna M3 al aceptar una solicitud.
          enum: [DESCONECTADO, CONECTADO, DISPONIBLE]
        id_vehiculo_activo:
          type: string
          format: uuid
          nullable: true
        latitud:
          type: number
          format: double
          description: Requiere longitud
        longitud:
          type: number
          format: double
          description: Requiere latitud

    EstadoConductor:
      type: object
      required: [id_conductor, estado, actualizado]
      properties:
        id_conductor:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoOperativo'
        id_vehiculo_activo:
          type: string
          format: uuid
          nullable: true
        actualizado:
          type: string
          format: date-time
          description: Cuándo cambió por última vez el estado o el vehículo activo. No incluye la ubicación, que tiene su propia fecha en `GET /conductores/{id_conductor}/ubicacion`.

    UbicacionConductor:
      type: object
      required: [id_conductor, latitud, longitud, fecha_act_ubic]
      properties:
        id_conductor:
          type: string
          format: uuid
        latitud:
          type: number
          format: double
          nullable: true
        longitud:
          type: number
          format: double
          nullable: true
        fecha_act_ubic:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se registró la ubicación, no cuándo se hizo la consulta.

    VehiculoCreate:
      type: object
      required: [tipo, patente, marca, modelo, anio, tipos_serv]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoVehiculo'
        patente:
          type: string
          maxLength: 10
        marca:
          type: string
          maxLength: 80
        modelo:
          type: string
          maxLength: 80
        anio:
          type: integer
          minimum: 1900
          maximum: 2100
        tipos_serv:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TipoServicio'

    TipoServicioHabilitado:
      type: object
      required: [tipo, habilitado]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoServicio'
        habilitado:
          type: boolean

    Vehiculo:
      type: object
      required: [id, id_conductor, tipo, patente, marca, modelo, anio, tipos_serv, documentos, habilitacion]
      properties:
        id:
          type: string
          format: uuid
        id_conductor:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoVehiculo'
        patente:
          type: string
        marca:
          type: string
        modelo:
          type: string
        anio:
          type: integer
          minimum: 1900
          maximum: 2100
        tipos_serv:
          type: array
          items:
            $ref: '#/components/schemas/TipoServicioHabilitado'
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoVehiculo'
        habilitacion:
          $ref: '#/components/schemas/EstadoHabilitacion'

    VehiculoResumen:
      type: object
      required: [id, tipo, patente, marca, modelo, anio, habilitacion]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoVehiculo'
        patente:
          type: string
        marca:
          type: string
        modelo:
          type: string
        anio:
          type: integer
          minimum: 1900
          maximum: 2100
        habilitacion:
          $ref: '#/components/schemas/EstadoHabilitacion'

    DocumentoConductorCreate:
      type: object
      required: [tipo, numero, fecha_emision, fecha_vencimiento, url_archivo]
      properties:
        tipo:
          type: string
          enum: [LICENCIA]
        numero:
          type: string
          maxLength: 50
        categoria:
          type: string
          maxLength: 10
        fecha_emision:
          type: string
          format: date
        fecha_vencimiento:
          type: string
          format: date
        url_archivo:
          type: string
          maxLength: 500
          format: uri
          pattern: '^[Hh][Tt][Tt][Pp][Ss]?://'
          description: URL `http` o `https`. Se guarda y se devuelve normalizada (`https://host` pasa a `https://host/`).

    DocumentoConductor:
      allOf:
        - $ref: '#/components/schemas/DocumentoConductorCreate'
        - type: object
          required: [id_conductor, estado]
          properties:
            id_conductor:
              type: string
              format: uuid
            estado:
              $ref: '#/components/schemas/EstadoDocumento'

    DocumentoVehiculoCreate:
      type: object
      required: [tipo, numero, fecha_emision, fecha_vencimiento, url_archivo]
      properties:
        tipo:
          type: string
          enum: [SEGURO, CEDULA_VERDE, VTV]
        numero:
          type: string
          minLength: 1
          maxLength: 50
        entidad_emisora:
          type: string
          maxLength: 255
        fecha_emision:
          type: string
          format: date
        fecha_vencimiento:
          type: string
          format: date
        url_archivo:
          type: string
          maxLength: 500
          format: uri
          pattern: '^[Hh][Tt][Tt][Pp][Ss]?://'
          description: URL `http` o `https`. Se guarda y se devuelve normalizada (`https://host` pasa a `https://host/`).

    DocumentoVehiculo:
      allOf:
        - $ref: '#/components/schemas/DocumentoVehiculoCreate'
        - type: object
          required: [id_vehiculo, estado]
          properties:
            id_vehiculo:
              type: string
              format: uuid
            estado:
              $ref: '#/components/schemas/EstadoDocumento'

    HabilitacionAccionRequest:
      type: object
      required: [accion, motivo]
      properties:
        accion:
          type: string
          enum: [APROBAR, OBSERVAR, SUSPENDER, RECHAZAR]
        motivo:
          type: string
          minLength: 1
          maxLength: 500

    HabilitacionHistorialItem:
      type: object
      required: [estado, motivo, fecha]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        motivo:
          type: string
          maxLength: 500
        id_operador:
          type: string
          format: uuid
          nullable: true
        fecha:
          type: string
          format: date-time

    HabilitacionResumen:
      type: object
      required: [id_conductor, estado, historial]
      properties:
        id_conductor:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        historial:
          type: array
          items:
            $ref: '#/components/schemas/HabilitacionHistorialItem'

    HabilitacionEvento:
      type: object
      required: [id, accion, estado_nuevo, motivo, fecha]
      properties:
        id:
          type: string
          format: uuid
        accion:
          $ref: '#/components/schemas/AccionHabilitacion'
        estado_anterior:
          type: string
          enum: [PENDIENTE, OBSERVADA, APROBADA, SUSPENDIDA, RECHAZADA, null]
          nullable: true
          description: null en el evento ALTA
        estado_nuevo:
          $ref: '#/components/schemas/EstadoHabilitacion'
        motivo:
          type: string
          maxLength: 500
        id_operador:
          type: string
          format: uuid
          nullable: true
          description: null si lo genera el sistema
        fecha:
          type: string
          format: date-time

    HabilitacionEventos:
      type: object
      required: [id_conductor, estado, eventos]
      properties:
        id_conductor:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/HabilitacionEvento'

    HabilitacionVehiculoEventos:
      type: object
      required: [id_vehiculo, estado, eventos]
      properties:
        id_vehiculo:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/HabilitacionEvento'

    # Integración con M5
    PuntoViaje:
      type: object
      required: [latitud, longitud]
      properties:
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
        direccion:
          type: string
          maxLength: 300
          nullable: true

    SolicitudCreate:
      type: object
      required: [id_solicitud_m5, id_viaje, tipo_servicio, origen, destino, vence_en]
      properties:
        id_solicitud_m5:
          type: string
          format: uuid
          description: Identificador de la oferta en M5
        id_viaje:
          type: string
          format: uuid
          description: UUID del viaje en M6. M5 lo envía con la oferta y M3 lo guarda para usarlo al calificar.
        tipo_servicio:
          $ref: '#/components/schemas/TipoServicio'
        origen:
          $ref: '#/components/schemas/PuntoViaje'
        destino:
          $ref: '#/components/schemas/PuntoViaje'
        vence_en:
          type: string
          format: date-time
          description: Fecha y hora límite en UTC para que el conductor acepte

    Solicitud:
      type: object
      required: [id, id_conductor, id_viaje, id_solicitud_m5, tipo_servicio, origen, destino, estado, vence_en]
      properties:
        id:
          type: string
          format: uuid
          description: ID interno de la oferta en M3
        id_conductor:
          type: string
          format: uuid
        id_viaje:
          type: string
          format: uuid
          description: UUID del viaje en M6; es el mismo valor que M6 envía a `POST /conductores/{id_conductor}/calificaciones`.
        id_solicitud_m5:
          type: string
          format: uuid
        tipo_servicio:
          $ref: '#/components/schemas/TipoServicio'
        origen:
          $ref: '#/components/schemas/PuntoViaje'
        destino:
          $ref: '#/components/schemas/PuntoViaje'
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        vence_en:
          type: string
          format: date-time
        respuesta:
          type: string
          enum: [ACEPTADO, RECHAZADO, null]
          nullable: true
        hora_rta:
          type: string
          format: date-time
          nullable: true

    RespuestaSolicitudRequest:
      type: object
      required: [respuesta, hora_rta]
      properties:
        respuesta:
          type: string
          enum: [ACEPTADO, RECHAZADO]
        hora_rta:
          type: string
          format: date-time

    # Integración con M6
    CalificacionConductorRequest:
      type: object
      required: [id_viaje, puntaje]
      properties:
        id_viaje:
          type: string
          format: uuid
          description: UUID del viaje en M6. M6 garantiza que está COMPLETED; M3 solo verifica que exista una oferta ACEPTADA de este conductor para ese viaje y que no haya sido calificado antes.
          example: "7b0e3a8e-4f7c-4d1a-9a52-1f0c2f9d6b11"
        puntaje:
          type: integer
          minimum: 1
          maximum: 5
          description: Puntuación otorgada al conductor (1 a 5)
          example: 5

    CalificacionConductor:
      type: object
      required: [id, id_viaje, id_conductor, puntaje, fecha]
      properties:
        id:
          type: string
          format: uuid
          example: 'b7f91658-e680-5b4b-88bc-0218000f7a75'
        id_viaje:
          type: string
          format: uuid
          example: "7b0e3a8e-4f7c-4d1a-9a52-1f0c2f9d6b11"
        id_conductor:
          type: string
          format: uuid
          example: '64e57cf1-ce28-55c4-954f-11a23eddeafd'
        puntaje:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        fecha:
          type: string
          format: date-time
          example: "2026-11-20T22:10:00Z"
