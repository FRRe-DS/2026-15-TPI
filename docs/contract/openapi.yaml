openapi: 3.0.3
info:
  title: API M3 - Conductores y Vehículos
  version: 1.2.0
  description: |
    Contrato del módulo M3 - Conductores y Vehículos.

    Describe solo lo que M3 expone. Lo que M3 consume de otros módulos se define en los contratos de esos módulos y no figura aquí.

    | Módulo | Sentido | Operación |
    |---|---|---|
    | M4 | M4 → M3 | `GET /conductores`, `GET /conductores/{id_conductor}`, `GET /conductores/{id_conductor}/estado` y `GET /conductores/{id_conductor}/ubicacion`: lectura de estado y ubicación |

    M3 no expone operaciones de escritura para otros módulos: el estado y la ubicación del conductor los informa el propio conductor con `PATCH /conductores/{id_conductor}/estado`, y M3 marca `OCUPADO` al aceptar una solicitud.

    Todas las fechas y horas están en UTC (ISO 8601 con `Z`).
servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Conductores
  - name: Vehículos
  - name: Documentación
  - name: Habilitación
  - name: Disponibilidad
  - name: Solicitudes

paths:
  /conductores:
    post:
      tags: [Conductores]
      summary: Crear conductor
      description: Queda con habilitación PENDIENTE y en estado DESCONECTADO.
      operationId: crearConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConductorCreate'
            example:
              dni: "30123456"
              nombre: Ana
              apellido: Gómez
              telefono: "+5491176543210"
              email: ana.gomez@example.com
      responses:
        '201':
          description: Conductor creado
          headers:
            Location:
              description: URL del conductor creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conductor'
              example:
                id: 1
                dni: "30123456"
                nombre: Ana
                apellido: Gómez
                telefono: "+5491176543210"
                email: ana.gomez@example.com
                documentos: []
                vehiculos: []
                habilitacion: PENDIENTE
                estado: DESCONECTADO
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya existe un conductor con ese DNI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: DNI_DUPLICADO
                mensaje: Ya existe un conductor con ese DNI.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Conductores]
      summary: Listar conductores
      description: Filtros opcionales de estado, habilitación y tipo de vehículo. Devuelve la ubicación persistida y su fecha, o null si no existe. En esta iteración latitud, longitud y tipo_servicio se aceptan pero no filtran ni ordenan; no se aplica vencimiento de ubicación.
      operationId: listarConductores
      parameters:
        - name: latitud
          in: query
          description: Requiere longitud
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitud
          in: query
          description: Requiere latitud
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoOperativo'
        - name: habilitado
          in: query
          description: true solo con habilitación APROBADA
          schema:
            type: boolean
        - name: tipo_vehiculo
          in: query
          schema:
            $ref: '#/components/schemas/TipoVehiculo'
        - name: tipo_servicio
          in: query
          schema:
            $ref: '#/components/schemas/TipoServicio'
      responses:
        '200':
          description: Lista de conductores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConductorConUbicacion'
              example:
                - id: 1
                  dni: "30123456"
                  nombre: Ana
                  apellido: Gómez
                  telefono: "+5491176543210"
                  email: ana.gomez@example.com
                  documentos: []
                  vehiculos: []
                  habilitacion: APROBADA
                  estado: DISPONIBLE
                  latitud: -27.4511
                  longitud: -58.9867
                  fecha_act_ubic: "2026-10-22T10:15:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Conductores]
      summary: Obtener conductor
      operationId: obtenerConductor
      responses:
        '200':
          description: Conductor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConductorConUbicacion'
              example:
                id: 1
                dni: "30123456"
                nombre: Ana
                apellido: Gómez
                telefono: "+5491176543210"
                email: ana.gomez@example.com
                documentos: []
                vehiculos: []
                habilitacion: APROBADA
                estado: DISPONIBLE
                latitud: -27.4511
                longitud: -58.9867
                fecha_act_ubic: "2026-10-22T10:15:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/habilitacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Habilitación]
      summary: Consultar habilitación del conductor
      operationId: obtenerHabilitacionConductor
      responses:
        '200':
          description: Estado e historial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacionResumen'
              example:
                id_conductor: 1
                estado: APROBADA
                historial:
                  - estado: PENDIENTE
                    motivo: Alta del conductor
                    id_operador: null
                    fecha: "2026-10-22T10:00:00Z"
                  - estado: APROBADA
                    motivo: Licencia vigente y documentación completa
                    id_operador: 7
                    fecha: "2026-10-22T12:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Habilitación]
      summary: Aprobar, observar, suspender o rechazar conductor
      description: Solo operadores autorizados. Registra un evento con motivo, operador y fecha.
      operationId: accionHabilitacionConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabilitacionAccionRequest'
            example:
              accion: APROBAR
              motivo: Licencia vigente y documentación completa
      responses:
        '200':
          description: Acción aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacionEventos'
              example:
                id_conductor: 1
                estado: APROBADA
                eventos:
                  - id: 1
                    accion: ALTA
                    estado_anterior: null
                    estado_nuevo: PENDIENTE
                    motivo: Alta del conductor
                    id_operador: null
                    fecha: "2026-10-22T10:00:00Z"
                  - id: 2
                    accion: APROBAR
                    estado_anterior: PENDIENTE
                    estado_nuevo: APROBADA
                    motivo: Licencia vigente y documentación completa
                    id_operador: 7
                    fecha: "2026-10-22T12:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: El conductor no tiene una licencia vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: LICENCIA_VIGENTE_REQUERIDA
                mensaje: El conductor no tiene una licencia vigente cargada.
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/documentacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    post:
      tags: [Documentación]
      summary: Registrar documentación del conductor
      operationId: crearDocumentacionConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentoConductorCreate'
            example:
              tipo: LICENCIA
              numero: LIC-12345678
              categoria: B1
              fecha_emision: "2024-05-10"
              fecha_vencimiento: "2028-05-10"
              url_archivo: https://storage.example.com/licencias/1.pdf
      responses:
        '201':
          description: Documento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoConductor'
              example:
                tipo: LICENCIA
                numero: LIC-12345678
                categoria: B1
                fecha_emision: "2024-05-10"
                fecha_vencimiento: "2028-05-10"
                url_archivo: https://storage.example.com/licencias/1.pdf
                id_conductor: 1
                estado: VIGENTE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    post:
      tags: [Vehículos]
      summary: Registrar vehículo
      description: Los tipos de servicio quedan sin habilitar hasta su aprobación.
      operationId: crearVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiculoCreate'
            example:
              tipo: AUTO
              patente: AB123CD
              marca: Toyota
              modelo: Corolla
              anio: 2022
              tipos_serv: [PASAJEROS]
      responses:
        '201':
          description: Vehículo registrado
          headers:
            Location:
              description: URL del vehículo creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehiculo'
              example:
                id: 1
                id_conductor: 1
                tipo: AUTO
                patente: AB123CD
                marca: Toyota
                modelo: Corolla
                anio: 2022
                tipos_serv:
                  - tipo: PASAJEROS
                    habilitado: false
                documentos: []
                habilitacion: PENDIENTE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya existe un vehículo con esa patente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: PATENTE_DUPLICADA
                mensaje: Ya existe un vehículo con esa patente.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Vehículos]
      summary: Listar vehículos del conductor
      operationId: listarVehiculos
      parameters:
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoVehiculo'
        - name: habilitacion
          in: query
          schema:
            $ref: '#/components/schemas/EstadoHabilitacion'
      responses:
        '200':
          description: Lista de vehículos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehiculoResumen'
              example:
                - id: 1
                  tipo: AUTO
                  patente: AB123CD
                  marca: Toyota
                  modelo: Corolla
                  anio: 2022
                  habilitacion: PENDIENTE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    get:
      tags: [Vehículos]
      summary: Obtener vehículo
      operationId: obtenerVehiculo
      responses:
        '200':
          description: Vehículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehiculo'
              example:
                id: 1
                id_conductor: 1
                tipo: AUTO
                patente: AB123CD
                marca: Toyota
                modelo: Corolla
                anio: 2022
                tipos_serv:
                  - tipo: PASAJEROS
                    habilitado: false
                documentos: []
                habilitacion: PENDIENTE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}/tipos-servicio:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    get:
      tags: [Vehículos]
      summary: Tipos de servicio del vehículo
      operationId: listarTiposServicioVehiculo
      responses:
        '200':
          description: Tipos de servicio y su habilitación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoServicioHabilitado'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}/documentacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    post:
      tags: [Documentación]
      summary: Registrar documentación del vehículo
      operationId: crearDocumentacionVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentoVehiculoCreate'
      responses:
        '201':
          description: Documento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoVehiculo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/vehiculos/{id_vehiculo}/habilitacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
      - $ref: '#/components/parameters/IdVehiculo'
    post:
      tags: [Habilitación]
      summary: Aprobar, observar, suspender o rechazar vehículo
      description: Solo operadores autorizados.
      operationId: accionHabilitacionVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabilitacionAccionRequest'
            example:
              accion: APROBAR
              motivo: Documentación del vehículo validada
      responses:
        '200':
          description: Acción aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacionVehiculoEventos'
              example:
                id_vehiculo: 1
                estado: APROBADA
                eventos:
                  - id: 1
                    accion: ALTA
                    estado_anterior: null
                    estado_nuevo: PENDIENTE
                    motivo: Alta del vehículo
                    id_operador: null
                    fecha: "2026-10-22T10:05:00Z"
                  - id: 2
                    accion: APROBAR
                    estado_anterior: PENDIENTE
                    estado_nuevo: APROBADA
                    motivo: Documentación del vehículo validada
                    id_operador: 7
                    fecha: "2026-10-22T13:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/estado:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Disponibilidad]
      summary: Consultar el estado del conductor
      description: Devuelve el estado del conductor (DESCONECTADO, CONECTADO, DISPONIBLE u OCUPADO) y el vehículo activo. La ubicación se consulta aparte en `GET /conductores/{id_conductor}/ubicacion`. Lo consulta M4. Roles `conductor`, `operador` y `servicio`.
      operationId: obtenerEstadoConductor
      responses:
        '200':
          description: Estado vigente del conductor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoConductor'
              example:
                id_conductor: 15
                estado: DISPONIBLE
                id_vehiculo_activo: 7
                actualizado: '2026-11-02T01:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Disponibilidad]
      summary: Actualizar el estado del conductor
      description: |
        Lo usa el conductor (o un operador) para informar su estado, el vehículo activo y la ubicación.

        - `estado` puede pedirse como `DESCONECTADO`, `CONECTADO` o `DISPONIBLE`. `OCUPADO` no se puede pedir: lo asigna M3 (ver abajo).
        - `DESCONECTADO` y `CONECTADO` se aceptan siempre, también desde `OCUPADO`.
        - Para quedar `DISPONIBLE`, el conductor debe tener habilitación APROBADA y un vehículo activo también APROBADA. Si no, responde `422` con `CONDUCTOR_NO_HABILITADO` y no cambia nada. Pedir `DISPONIBLE` estando `DESCONECTADO` también lo conecta, y estando `OCUPADO` lo libera.
        - Si se quita el vehículo activo, o se cambia a uno que no está APROBADA, un conductor `DISPONIBLE` pasa a `CONECTADO`.
        - Si se informan `latitud` y `longitud` (siempre juntas), M3 las guarda y fija `fecha_act_ubic` con la hora del servidor. Si no se informan, M3 puede simular la ubicación porque el TPI no tiene una app móvil que reporte GPS.
        - Al aceptar una solicitud con `POST /solicitudes/{id_solicitud}`, M3 pasa al conductor a `OCUPADO`. Vuelve a `DISPONIBLE` cuando el conductor lo pide con esta operación.
      operationId: actualizarEstadoConductor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoConductorRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoConductor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: El conductor no puede quedar DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: CONDUCTOR_NO_HABILITADO
                mensaje: El conductor debe estar habilitado y tener un vehículo activo habilitado.
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/ubicacion:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Disponibilidad]
      summary: Consultar la ubicación del conductor
      description: Devuelve la última ubicación registrada y su fecha. Si todavía no hay ninguna, responde 200 con los tres campos en null, que debe tratarse como ubicación desconocida y nunca como (0, 0). No aplica vencimiento de ubicación. Lo consulta M4. Roles `conductor`, `operador` y `servicio`.
      operationId: obtenerUbicacionConductor
      responses:
        '200':
          description: Última ubicación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UbicacionConductor'
              example:
                id_conductor: 15
                latitud: -27.4511
                longitud: -58.9867
                fecha_act_ubic: '2026-11-02T01:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conductores/{id_conductor}/solicitudes:
    parameters:
      - $ref: '#/components/parameters/IdConductor'
    get:
      tags: [Solicitudes]
      summary: Listar solicitudes del conductor
      operationId: listarSolicitudesConductor
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoSolicitud'
      responses:
        '200':
          description: Lista de solicitudes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Solicitud'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /solicitudes/{id_solicitud}:
    parameters:
      - name: id_solicitud
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Solicitudes]
      summary: Aceptar o rechazar una solicitud
      description: Solo mientras la oferta esté vigente; vencida devuelve 410. Al aceptar, el conductor pasa a estado OCUPADO.
      operationId: responderSolicitud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaSolicitudRequest'
      responses:
        '200':
          description: Respuesta registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitud'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT emitido por Keycloak (realm `m3`). Roles:

        - `operador`: acciones de habilitación. El token trae el claim entero `id_operador`.
        - `conductor`: consulta de conductores y vehículos.
        - `servicio`: cuenta técnica de otros módulos (M4). Solo puede leer conductores, vehículos, estado y ubicación.

  parameters:
    IdConductor:
      name: id_conductor
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdVehiculo:
      name: id_vehiculo
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Solicitud mal formada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOLICITUD_INVALIDA
            mensaje: El cuerpo de la solicitud no es válido.
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_AUTENTICADO
            mensaje: Token ausente o inválido.
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SIN_PERMISOS
            mensaje: Se requiere el rol operador.
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_ENCONTRADO
            mensaje: El recurso indicado no existe.
    Conflict:
      description: Duplicado o transición inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: TRANSICION_INVALIDA
            mensaje: La transición solicitada no está permitida.
    Gone:
      description: Oferta vencida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Incumple una regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DATOS_INVALIDOS
            mensaje: Los datos enviados no son válidos.
    InternalError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: ERROR_INTERNO
            mensaje: Ocurrió un error interno.

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
        mensaje:
          type: string

    EstadoHabilitacion:
      type: string
      enum: [PENDIENTE, OBSERVADA, APROBADA, SUSPENDIDA, RECHAZADA]
    AccionHabilitacion:
      type: string
      description: ALTA la genera el sistema.
      enum: [ALTA, APROBAR, OBSERVAR, SUSPENDER, RECHAZAR]
    TipoVehiculo:
      type: string
      enum: [AUTO, MOTO]
    TipoServicio:
      type: string
      enum: [PASAJEROS, ENVIOS]
    EstadoDocumento:
      type: string
      description: Según fecha_vencimiento.
      enum: [VIGENTE, VENCIDO]
    # Pendiente de acordar con M4 y M6: M3 pasa al conductor a OCUPADO al aceptar una solicitud y
    # vuelve a DISPONIBLE cuando el conductor lo pide. Ningún otro módulo escribe este estado. Si M4 o M6
    # necesitan marcarlo (por ejemplo al terminar un viaje), habría que sumar una operación de escritura.
    EstadoOperativo:
      type: string
      description: |
        Qué está haciendo el conductor ahora.

        - `DESCONECTADO`: no tiene la app activa.
        - `CONECTADO`: está activo pero no recibe viajes (en pausa).
        - `DISPONIBLE`: puede recibir viajes. Exige habilitación APROBADA y un vehículo activo APROBADA.
        - `OCUPADO`: está en un viaje. Lo asigna M3 al aceptar una solicitud; no se puede pedir en `PATCH /conductores/{id_conductor}/estado`.
      enum: [DESCONECTADO, CONECTADO, DISPONIBLE, OCUPADO]
    # TODO confirmar estados con M5
    EstadoSolicitud:
      type: string
      enum: [PENDIENTE, ACEPTADO, RECHAZADO, VENCIDA]
    ConductorCreate:
      type: object
      required: [dni, nombre, apellido, telefono, email]
      properties:
        dni:
          type: string
          maxLength: 8
          pattern: '^[0-9]{7,8}$'
        nombre:
          type: string
          maxLength: 100
        apellido:
          type: string
          maxLength: 100
        telefono:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 255
          format: email

    Conductor:
      allOf:
        - $ref: '#/components/schemas/ConductorCreate'
        - type: object
          required: [id, documentos, vehiculos, habilitacion, estado]
          properties:
            id:
              type: integer
              format: int64
            documentos:
              type: array
              items:
                $ref: '#/components/schemas/DocumentoConductor'
            vehiculos:
              type: array
              items:
                $ref: '#/components/schemas/VehiculoResumen'
            habilitacion:
              $ref: '#/components/schemas/EstadoHabilitacion'
            estado:
              $ref: '#/components/schemas/EstadoOperativo'
            puntaje_promedio:
              type: number
              format: double
              minimum: 1
              maximum: 5
              nullable: true
              description: Promedio de los puntajes recibidos. null si todavía no tiene.
            cantidad_calificaciones:
              type: integer
              minimum: 0
              default: 0

    ConductorConUbicacion:
      allOf:
        - $ref: '#/components/schemas/Conductor'
        - type: object
          properties:
            id_vehiculo_activo:
              type: integer
              format: int64
              nullable: true
              description: Vehículo con el que trabaja el conductor. null si no tiene uno activo.
            latitud:
              type: number
              format: double
              nullable: true
            longitud:
              type: number
              format: double
              nullable: true
            fecha_act_ubic:
              type: string
              format: date-time
              nullable: true

    EstadoConductorRequest:
      type: object
      description: Al menos un campo. La ubicación es opcional; si no se informa, M3 puede simularla.
      minProperties: 1
      properties:
        estado:
          type: string
          description: No admite OCUPADO, que lo asigna M3 al aceptar una solicitud.
          enum: [DESCONECTADO, CONECTADO, DISPONIBLE]
        id_vehiculo_activo:
          type: integer
          format: int64
          nullable: true
        latitud:
          type: number
          format: double
          description: Requiere longitud
        longitud:
          type: number
          format: double
          description: Requiere latitud

    EstadoConductor:
      type: object
      required: [id_conductor, estado, actualizado]
      properties:
        id_conductor:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoOperativo'
        id_vehiculo_activo:
          type: integer
          format: int64
          nullable: true
        actualizado:
          type: string
          format: date-time
          description: Cuándo cambió por última vez el estado o el vehículo activo. No incluye la ubicación, que tiene su propia fecha en `GET /conductores/{id_conductor}/ubicacion`.

    UbicacionConductor:
      type: object
      required: [id_conductor, latitud, longitud, fecha_act_ubic]
      properties:
        id_conductor:
          type: integer
          format: int64
        latitud:
          type: number
          format: double
          nullable: true
        longitud:
          type: number
          format: double
          nullable: true
        fecha_act_ubic:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se registró la ubicación, no cuándo se hizo la consulta.

    VehiculoCreate:
      type: object
      required: [tipo, patente, marca, modelo, anio, tipos_serv]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoVehiculo'
        patente:
          type: string
          maxLength: 10
        marca:
          type: string
          maxLength: 80
        modelo:
          type: string
          maxLength: 80
        anio:
          type: integer
          minimum: 1900
          maximum: 2100
        tipos_serv:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TipoServicio'

    TipoServicioHabilitado:
      type: object
      required: [tipo, habilitado]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoServicio'
        habilitado:
          type: boolean

    Vehiculo:
      type: object
      required: [id, id_conductor, tipo, patente, marca, modelo, anio, tipos_serv, documentos, habilitacion]
      properties:
        id:
          type: integer
          format: int64
        id_conductor:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoVehiculo'
        patente:
          type: string
        marca:
          type: string
        modelo:
          type: string
        anio:
          type: integer
          minimum: 1900
          maximum: 2100
        tipos_serv:
          type: array
          items:
            $ref: '#/components/schemas/TipoServicioHabilitado'
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoVehiculo'
        habilitacion:
          $ref: '#/components/schemas/EstadoHabilitacion'

    VehiculoResumen:
      type: object
      required: [id, tipo, patente, marca, modelo, anio, habilitacion]
      properties:
        id:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoVehiculo'
        patente:
          type: string
        marca:
          type: string
        modelo:
          type: string
        anio:
          type: integer
          minimum: 1900
          maximum: 2100
        habilitacion:
          $ref: '#/components/schemas/EstadoHabilitacion'

    DocumentoConductorCreate:
      type: object
      required: [tipo, numero, fecha_emision, fecha_vencimiento, url_archivo]
      properties:
        tipo:
          type: string
          enum: [LICENCIA]
        numero:
          type: string
          maxLength: 50
        categoria:
          type: string
          maxLength: 10
        fecha_emision:
          type: string
          format: date
        fecha_vencimiento:
          type: string
          format: date
        url_archivo:
          type: string
          maxLength: 500
          format: uri

    DocumentoConductor:
      allOf:
        - $ref: '#/components/schemas/DocumentoConductorCreate'
        - type: object
          required: [id_conductor, estado]
          properties:
            id_conductor:
              type: integer
              format: int64
            estado:
              $ref: '#/components/schemas/EstadoDocumento'

    DocumentoVehiculoCreate:
      type: object
      required: [tipo, numero, fecha_emision, fecha_vencimiento, url_archivo]
      properties:
        tipo:
          type: string
          enum: [SEGURO, CEDULA_VERDE, VTV]
        numero:
          type: string
        entidad_emisora:
          type: string
        fecha_emision:
          type: string
          format: date
        fecha_vencimiento:
          type: string
          format: date
        url_archivo:
          type: string
          format: uri

    DocumentoVehiculo:
      allOf:
        - $ref: '#/components/schemas/DocumentoVehiculoCreate'
        - type: object
          required: [id_vehiculo, estado]
          properties:
            id_vehiculo:
              type: integer
              format: int64
            estado:
              $ref: '#/components/schemas/EstadoDocumento'

    HabilitacionAccionRequest:
      type: object
      required: [accion, motivo]
      properties:
        accion:
          type: string
          enum: [APROBAR, OBSERVAR, SUSPENDER, RECHAZAR]
        motivo:
          type: string
          minLength: 1
          maxLength: 500

    HabilitacionHistorialItem:
      type: object
      required: [estado, motivo, fecha]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        motivo:
          type: string
          maxLength: 500
        id_operador:
          type: integer
          format: int64
          nullable: true
        fecha:
          type: string
          format: date-time

    HabilitacionResumen:
      type: object
      required: [id_conductor, estado, historial]
      properties:
        id_conductor:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        historial:
          type: array
          items:
            $ref: '#/components/schemas/HabilitacionHistorialItem'

    HabilitacionEvento:
      type: object
      required: [id, accion, estado_nuevo, motivo, fecha]
      properties:
        id:
          type: integer
          format: int64
        accion:
          $ref: '#/components/schemas/AccionHabilitacion'
        estado_anterior:
          type: string
          enum: [PENDIENTE, OBSERVADA, APROBADA, SUSPENDIDA, RECHAZADA, null]
          nullable: true
          description: null en el evento ALTA
        estado_nuevo:
          $ref: '#/components/schemas/EstadoHabilitacion'
        motivo:
          type: string
          maxLength: 500
        id_operador:
          type: integer
          format: int64
          nullable: true
          description: null si lo genera el sistema
        fecha:
          type: string
          format: date-time

    HabilitacionEventos:
      type: object
      required: [id_conductor, estado, eventos]
      properties:
        id_conductor:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/HabilitacionEvento'

    HabilitacionVehiculoEventos:
      type: object
      required: [id_vehiculo, estado, eventos]
      properties:
        id_vehiculo:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoHabilitacion'
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/HabilitacionEvento'

    # TODO confirmar campos con M5
    Solicitud:
      type: object
      required: [id, id_conductor, estado, vence_en]
      example:
        id: 340
        id_conductor: 15
        id_viaje: 5521
        estado: ACEPTADO
        vence_en: '2026-10-03T18:45:30Z'
        respuesta: ACEPTADO
        hora_rta: '2026-10-03T18:44:10Z'
      properties:
        id:
          type: integer
          format: int64
        id_conductor:
          type: integer
          format: int64
        id_viaje:
          type: integer
          format: int64
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        vence_en:
          type: string
          format: date-time
          description: Límite para responder
        respuesta:
          type: string
          enum: [ACEPTADO, RECHAZADO]
          nullable: true
        hora_rta:
          type: string
          format: date-time
          nullable: true

    RespuestaSolicitudRequest:
      type: object
      required: [respuesta, hora_rta]
      properties:
        respuesta:
          type: string
          enum: [ACEPTADO, RECHAZADO]
        hora_rta:
          type: string
          format: date-time
