name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint y formato
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen --group dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  contrato:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen --all-groups
      - name: Validar openapi.yaml
        run: |
          uv run python - <<'PY'
          import yaml
          from openapi_spec_validator import validate

          with open("../docs/contract/openapi.yaml", encoding="utf-8") as archivo:
              validate(yaml.safe_load(archivo))
          PY
      - name: Pruebas de contrato
        run: uv run pytest tests/contrato -v

  test:
    name: Suite completa con PostgreSQL y Keycloak
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen --all-groups
      - name: Comprobar Docker
        run: docker info
      - name: Pruebas completas con cobertura
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=65

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar frontend
        id: detectar
        run: |
          if [ -f frontend/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No existe frontend/package.json; se omite el frontend."
          fi
      - uses: actions/setup-node@v4
        if: steps.detectar.outputs.existe == 'true'
        with:
          node-version: "24"
      - name: Instalar dependencias
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Lint
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: Pruebas
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run test --if-present -- --run

      - name: Compilar frontend
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E con Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            frontend/package-lock.json
      - name: Preparar variables de entorno
        run: bash e2e/scripts/stack.sh generar-env
      - name: Instalar dependencias E2E
        working-directory: e2e
        run: npm ci
      - name: Instalar Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: Escribir entorno del frontend
        run: bash e2e/scripts/stack.sh frontend-env
      - name: Levantar el stack
        run: bash e2e/scripts/stack.sh up
      - name: Ejecutar Playwright
        working-directory: e2e
        env:
          PW_WEBSERVER: "1"
        run: npx playwright test
      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Bajar el stack
        if: always()
        run: bash e2e/scripts/stack.sh down --volumes

  ci:
    name: ci
    if: always()
    needs:
      - lint
      - test
      - contrato
      - frontend
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultado de los jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Algún job de CI falló o fue cancelado."
          exit 1
      - name: CI en verde
        run: echo "Todos los jobs de CI pasaron."
