name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint y formato
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen --group dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  contrato:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen --all-groups
      - name: Validar openapi.yaml
        run: |
          uv run python - <<'PY'
          import yaml
          from openapi_spec_validator import validate

          with open("../docs/contract/openapi.yaml", encoding="utf-8") as archivo:
              validate(yaml.safe_load(archivo))
          PY
      - name: Pruebas de contrato
        run: uv run pytest tests/contrato -v

  test:
    name: Suite completa con PostgreSQL y Keycloak
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      REDIS_URL: redis://localhost:6379/0
      REDIS_PASSWORD: ""
      RATE_LIMIT_HMAC_SECRET: 0123456789abcdef0123456789abcdef-test-ci
      RATE_LIMIT_TEST_REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_ANON_REQUESTS: "60"
      RATE_LIMIT_PREAUTH_REQUESTS: "1000"
      RATE_LIMIT_AUTH_REQUESTS: "1000"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen --all-groups
      - name: Comprobar Docker
        run: docker info
      - name: Pruebas completas con cobertura
        run: uv run pytest --ignore=tests/e2e --cov=app --cov-report=term-missing --cov-fail-under=65

  entorno:
    name: Humo del entorno
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar variables de entorno
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^M3_DB_PASSWORD=.*|M3_DB_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^KEYCLOAK_DB_PASSWORD=.*|KEYCLOAK_DB_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^KEYCLOAK_ADMIN=.*|KEYCLOAK_ADMIN=admin|" \
            -e "s|^KEYCLOAK_ADMIN_PASSWORD=.*|KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^KEYCLOAK_M3_CLIENT_SECRET=.*|KEYCLOAK_M3_CLIENT_SECRET=$(openssl rand -hex 32)|" \
            -e "s|^M3_OPERADOR_PASSWORD=.*|M3_OPERADOR_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^M3_CONDUCTOR_PASSWORD=.*|M3_CONDUCTOR_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^M3_SERVICIO_USERNAME=.*|M3_SERVICIO_USERNAME=servicio.m4|" \
            -e "s|^M3_SERVICIO_PASSWORD=.*|M3_SERVICIO_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=$(openssl rand -hex 32)|" \
            -e "s|^RATE_LIMIT_HMAC_SECRET=.*|RATE_LIMIT_HMAC_SECRET=$(openssl rand -hex 32)|" \
            -e "s|^RATE_LIMIT_ANON_REQUESTS=.*|RATE_LIMIT_ANON_REQUESTS=60|" \
            -e "s|^RATE_LIMIT_PREAUTH_REQUESTS=.*|RATE_LIMIT_PREAUTH_REQUESTS=1000|" \
            -e "s|^RATE_LIMIT_AUTH_REQUESTS=.*|RATE_LIMIT_AUTH_REQUESTS=1000|" \
            -e "s|^RATE_LIMIT_WINDOW_SECONDS=.*|RATE_LIMIT_WINDOW_SECONDS=60|" \
            .env
      - name: Preparar Compose para las pruebas E2E
        env:
          CONSERVAR_ENTORNO: "1"
        run: bash .github/scripts/humo.sh --preparar
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias para E2E
        working-directory: backend
        run: uv sync --frozen --all-groups
      - name: Pruebas E2E contra el Compose
        working-directory: backend
        run: |
          set -o pipefail
          uv run pytest tests/e2e -v -rs | tee /tmp/e2e.log
          if grep -Eq '[0-9]+ skipped' /tmp/e2e.log; then
            echo "::error::Las pruebas E2E no pueden omitirse."
            exit 1
          fi
      - name: Ejecutar prueba de humo del entorno
        run: bash .github/scripts/humo.sh
      - name: Bajar Compose
        if: always()
        run: docker compose --env-file .env -f docker-compose.yml down --volumes --remove-orphans

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar frontend
        id: detectar
        run: |
          if [ -f frontend/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No existe frontend/package.json; se omite el frontend."
          fi
      - uses: actions/setup-node@v4
        if: steps.detectar.outputs.existe == 'true'
        with:
          node-version: "24"
      - name: Instalar dependencias
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Lint
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: Pruebas
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run test --if-present -- --run

      - name: Compilar frontend
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run build

  ci:
    name: ci
    if: always()
    needs:
      - lint
      - test
      - contrato
      - entorno
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultado de los jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Algún job de CI falló o fue cancelado."
          exit 1
      - name: CI en verde
        run: echo "Todos los jobs de CI pasaron."

  publicar:
    name: Publicar imagen en Docker Hub
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Comprobar configuración de Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Falta el secreto DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Falta el secreto DOCKERHUB_TOKEN"; exit 1; }
          test -n "$DOCKERHUB_IMAGE" || { echo "::error::Falta la variable DOCKERHUB_IMAGE"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir y publicar Backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_IMAGE }}:${{ github.ref_name }}
