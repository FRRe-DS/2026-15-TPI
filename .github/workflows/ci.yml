name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint y formato
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen --group dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  contrato:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen --group test
      - name: Validar openapi.yaml
        run: |
          uv run python - <<'PY'
          import yaml
          from openapi_spec_validator import validate

          with open("../docs/contract/openapi.yaml", encoding="utf-8") as archivo:
              validate(yaml.safe_load(archivo))
          PY
      - name: Pruebas de contrato
        run: uv run pytest tests/contrato -v

  test:
    name: Unitarias y API con cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen --group test
      - name: Pruebas unitarias y de API con cobertura
        run: |
          if [ ! -d app ]; then
            echo "::warning::backend/app todavía no existe; se omite la cobertura."
            exit 0
          fi
          rutas=()
          if [ -d tests/unitarios ]; then
            rutas+=("tests/unitarios")
          fi
          if [ -d tests/api ]; then
            rutas+=("tests/api")
          fi
          if [ ${#rutas[@]} -eq 0 ]; then
            echo "::warning::No hay tests/unitarios ni tests/api; se omite la cobertura."
            exit 0
          fi
          uv run pytest "${rutas[@]}" --cov=app --cov-report=term-missing --cov-fail-under=65

  integracion:
    name: Integración y concurrencia
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen --group test
      - name: Pruebas de integración y concurrencia
        run: |
          if [ ! -d tests/integracion ]; then
            echo "::warning::Todavía no existe tests/integracion; se omite."
            exit 0
          fi
          uv run pytest tests/integracion -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar frontend
        id: detectar
        run: |
          if [ -f frontend/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No existe frontend/package.json; se omite el frontend."
          fi
      - uses: actions/setup-node@v4
        if: steps.detectar.outputs.existe == 'true'
        with:
          node-version: "24"
      - name: Instalar dependencias
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Lint
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: Pruebas
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run test --if-present -- --run

  ci:
    name: ci
    if: always()
    needs:
      - lint
      - test
      - contrato
      - integracion
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultado de los jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Algún job de CI falló o fue cancelado."
          exit 1
      - name: CI en verde
        run: echo "Todos los jobs de CI pasaron."
