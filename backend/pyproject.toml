[project]
name = "m3-conductores-vehiculos"
version = "0.1.0"
description = "Módulo 3 (Conductores y Vehículos) - Iteración 1"
requires-python = ">=3.12,<3.13"
dependencies = []

# Un grupo por stack para que cada uno sume solo lo suyo y evitar conflictos.
[dependency-groups]
dev = [          # Stack 1: lógica
    "pytest>=9.1,<9.2",
    "pytest-cov>=7.1,<7.2",
    "ruff>=0.17,<0.18",
]
api = []         # Stack 2: servidor HTTP
db = []          # Stack 3: datos y seguridad
test = []        # Stack 4: testing y CI

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
